    // 1. Render Races
    function renderRaces(filter = 'all') {
      const container = document.getElementById('fsrRacesList');
      if (!container) return;

      const filtered = RACING_DATA.races.filter(race => {
        if (filter === 'usa') return race.isUsa;
        if (filter === 'global') return !race.isUsa;
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 40px 20px; color: #94a3b8; font-weight: 600;">
            No upcoming races found for this selection.
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(race => {
        const contendersHtml = race.contenders ? `
          <div class="fsr-race-contenders">
            <span class="fsr-contenders-lbl">Contenders:</span>
            <span class="fsr-contenders-txt">${race.contenders}</span>
          </div>
        ` : '';

        return `
          <div class="fsr-race-card">
            <div class="fsr-race-top">
              <div style="display: flex; align-items: center; gap: 6px;">
                <span class="fsr-race-grade">${race.grade}</span>
                <span class="fsr-race-country-badge">${race.flag} ${race.country}</span>
              </div>
              <span class="fsr-race-date-badge">📅 ${race.date}</span>
            </div>
            <h4 class="fsr-race-name">${race.raw_name || race.name}</h4>
            <div class="fsr-race-meta-row">
              <span class="fsr-race-track">📍 ${race.track} • ${race.dist}</span>
              <span class="fsr-race-purse">Purse: ${race.purse}</span>
            </div>
            ${contendersHtml}
          </div>
        `;
      }).join('');
    }

    // 2. Render Top Earners
    function renderEarners(view = 'horses') {
      const container = document.getElementById('fsrEarnersList');
      if (!container) return;

      const list = view === 'horses' ? RACING_DATA.horses : RACING_DATA.jockeys;

      if (!list || list.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 40px 20px; color: #94a3b8; font-weight: 600;">
            No leaderboard data available.
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="fsr-earner-card">
          <div class="fsr-rank-num fsr-rank-${item.rank}">${item.rank}</div>
          <div class="fsr-earner-info">
            <h4 class="fsr-earner-name">${item.flag} ${item.name}</h4>
            <span class="fsr-earner-sub">${item.sub}</span>
          </div>
          <div class="fsr-earner-cash">
            <div>${item.cash}</div>
            <div class="fsr-earner-cash-label">Earnings</div>
          </div>
        </div>
      `).join('');
    }

    // 3. Setup Interactive Event Listeners
    function initHub() {
      renderRaces('all');
      renderEarners('horses');

      // Race Filter Buttons
      const raceFilters = document.getElementById('fsrRaceFilters');
      if (raceFilters) {
        raceFilters.querySelectorAll('.fsr-pill-btn').forEach(btn => {
          btn.addEventListener('click', function () {
            raceFilters.querySelectorAll('.fsr-pill-btn').forEach(b => b.classList.remove('is-active'));
            this.classList.add('is-active');
            renderRaces(this.getAttribute('data-filter'));
          });
        });
      }

      // Earner Toggle Buttons
      const earnerToggle = document.getElementById('fsrEarnerToggle');
      if (earnerToggle) {
        earnerToggle.querySelectorAll('.fsr-pill-btn').forEach(btn => {
          btn.addEventListener('click', function () {
            earnerToggle.querySelectorAll('.fsr-pill-btn').forEach(b => b.classList.remove('is-active'));
            this.classList.add('is-active');
            renderEarners(this.getAttribute('data-view'));
          });
        });
      }

      // Optional: Auto-fetch fresh JSON if remote DATA_URL is configured
      if (typeof DATA_URL !== 'undefined' && DATA_URL) {
        fetch(DATA_URL)
          .then(res => res.json())
          .then(data => {
            if (data && (data.races || data.horses)) {
              if (data.races) RACING_DATA.races = data.races;
              if (data.horses) RACING_DATA.horses = data.horses;
              if (data.jockeys) RACING_DATA.jockeys = data.jockeys;
              const activeRaceFilter = document.querySelector('#fsrRaceFilters .fsr-pill-btn.is-active');
              const activeEarnerView = document.querySelector('#fsrEarnerToggle .fsr-pill-btn.is-active');
              renderRaces(activeRaceFilter ? activeRaceFilter.getAttribute('data-filter') : 'all');
              renderEarners(activeEarnerView ? activeEarnerView.getAttribute('data-view') : 'horses');
            }
          })
          .catch(() => { /* Silent fallback to embedded data */ });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initHub);
    } else {
      initHub();
    }
  })();
</script>
