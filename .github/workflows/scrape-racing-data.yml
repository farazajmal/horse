name: Scrape Racing Data & Update Hub

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime
  repository_dispatch: # Allows external webhook triggers (cron-job.org)
    types: [scrape-data]

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 🏁 Run Racing Scraper
        run: |
          python racing_scraper.py

      - name: 💾 Commit and Push Scraped Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add racing_data.json racing-hub-widget.html
          if git diff --staged --quiet; then
            echo "No updates to commit."
          else
            git commit -m "Auto-update live racing data & leaderboards [skip ci]"
            git push
          fi
